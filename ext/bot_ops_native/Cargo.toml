[package]
name = "bot_ops_native"
version = "0.1.0"
edition = "2021"
description = "Native window and renderer for Bot Ops Blue (egui/eframe, exposed to Ruby through Rutie)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rutie = { version = "0.13.3", features = ["derive"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSThread", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.2", features = ["NSResponder", "NSView", "NSWindow", "NSScreen", "NSApplication", "NSDockTile", "NSEvent"] }
